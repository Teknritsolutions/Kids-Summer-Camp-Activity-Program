<!doctype html>
<html lang="en" data-theme="light" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The next adventure is coming | Campora</title>
    <meta
      name="description"
      content="A sample camp launch countdown and local subscription form."
    />
    <meta
      property="og:title"
      content="The next adventure is coming | Campora"
    />
    <meta
      property="og:description"
      content="A sample camp launch countdown and local subscription form."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#223451" />
    <link
      rel="icon"
      href="../assets/images/branding/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="../assets/images/branding/favicon-32.png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="../assets/images/branding/apple-touch-icon.png"
    />
    <script src="../assets/js/theme.js"></script>
    <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/heroes.css" />
    <link rel="stylesheet" href="../assets/css/polish.css" />
    <link rel="stylesheet" href="../assets/css/access.css" />
    <script defer src="../assets/vendor/chart.umd.min.js"></script>
    <script defer src="../assets/vendor/jspdf.umd.min.js"></script>
    <script defer src="../assets/js/data.js"></script>
    <script defer src="../assets/js/main.js"></script>
    <script defer src="../assets/js/charts.js"></script>
    <script defer src="../assets/js/dashboard.js"></script>
    <script defer src="../assets/js/interactions.js"></script>
  </head>
  <body data-page="coming-soon">
    <div id="app">
      <a href="#main" class="skip-link">Skip to content</a>
      <div class="access-appearance" aria-label="Appearance settings">
        <button
          class="icon-btn"
          data-action="theme"
          aria-label="Switch color theme"
          title="Switch to dark mode"
        >
          <i class="bi bi-moon-stars" aria-hidden="true"> </i>
        </button>
        <button
          class="direction-toggle"
          data-action="rtl"
          aria-label="Switch to RTL layout"
          title="Switch to right-to-left layout"
        >
          <i class="bi bi-text-right" aria-hidden="true"> </i>
          <span data-direction-label>RTL</span>
        </button>
      </div>
      <main id="main">
        <section class="launch-page">
          <div class="launch-page__copy">
            <a
              class="brand launch-page__brand"
              href="./index.html"
              aria-label="Campora home"
            >
              <img
                src="../assets/images/branding/mark.svg"
                alt=""
                width="36"
                height="36"
              />campora.</a
            >
            <span class="eyebrow">Something good is growing</span>
            <h1>A new season of little adventures.</h1>
            <p>
              More discoveries, new friendships, and days worth remembering.
              Count down to our next season, starting June 7, 2027.
            </p>
            <div
              id="countdown"
              class="countdown launch-countdown"
              aria-label="Time until the next season"
            ></div>
            <form data-form="subscribe" class="launch-signup">
              <label for="launch-email">Be part of the next adventure</label>
              <div class="launch-signup__row">
                <input
                  id="launch-email"
                  type="email"
                  name="email"
                  placeholder="Your email address"
                  autocomplete="email"
                  required
                />
                <button class="btn btn-primary">
                  Join the list
                  <i class="bi bi-arrow-right" aria-hidden="true"> </i>
                </button>
              </div>
              <small
                >Registration of interest is saved in this browser only. No
                email is sent.</small
              >
              <div role="status" class="form-feedback"></div>
            </form>
            <a class="launch-home" href="./index.html">
              <i class="bi bi-arrow-left" aria-hidden="true"> </i> Back to
              Campora</a
            >
          </div>
          <figure class="launch-page__visual">
            <img
              src="../assets/images/heroes/trail.webp"
              srcset="
                ../assets/images/heroes/trail-480.webp  480w,
                ../assets/images/heroes/trail-960.webp  960w,
                ../assets/images/heroes/trail.webp     1400w
              "
              sizes="(max-width: 576px) calc(100vw - 32px), (max-width: 820px) calc(100vw - 48px), 600px"
              alt="A sunny woodland path leading to a welcoming camp cabin"
              class="launch-page__image"
              width="1000"
              height="700"
              loading="eager"
              fetchpriority="high"
            />
            <figcaption>
              <span>
                <i class="bi bi-sun" aria-hidden="true"> </i> Summer starts with
                possibility.</span
              >
              <strong
                >A little adventure.<br />A whole lot to look forward
                to.</strong
              >
            </figcaption>
          </figure>
        </section>
      </main>
    </div>
    <noscript
      ><p class="site-container">
        Enable JavaScript for filters, dashboards, and local demo forms.
      </p></noscript
    >
  </body>
</html>
